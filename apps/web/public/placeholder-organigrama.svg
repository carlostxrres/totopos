<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <rect width="600" height="220" fill="#f3f4f6"/>

  <!-- Ayuntamiento box -->
  <rect x="210" y="16" width="180" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="300" y="43" font-family="sans-serif" font-size="13" fill="#3730a3" text-anchor="middle" font-weight="600">Ayuntamiento</text>

  <!-- Connecting lines -->
  <line x1="300" y1="60" x2="300" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="80" x2="490" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="80" x2="110" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="80" x2="300" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="490" y1="80" x2="490" y2="100" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Pleno box -->
  <rect x="30" y="100" width="160" height="44" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="110" y="127" font-family="sans-serif" font-size="12" fill="#713f12" text-anchor="middle" font-weight="600">Pleno</text>

  <!-- Junta box -->
  <rect x="215" y="100" width="170" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="121" font-family="sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="600">Junta de</text>
  <text x="300" y="136" font-family="sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="600">Gobierno Local</text>

  <!-- Alcaldía box -->
  <rect x="410" y="100" width="160" height="44" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="490" y="121" font-family="sans-serif" font-size="11" fill="#831843" text-anchor="middle" font-weight="600">Alcaldía</text>
  <text x="490" y="136" font-family="sans-serif" font-size="11" fill="#831843" text-anchor="middle" font-weight="600">(Presidencia)</text>

  <!-- Caption -->
  <text x="300" y="195" font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Organigrama simplificado del gobierno municipal</text>
</svg>
